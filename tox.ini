[tox]
envlist =
    py313
    py314
skip_missing_interpreters =
    True

[testenv]
extras =
    mssql
passenv =
    WINDIR  # this is done for pyODBC
deps =
    pytest
    pyyaml
commands =
    pytest {posargs}

[testenv:py314]
# Experimental: relies on the SQLAlchemy 2.1 beta, don't fail the whole tox run on breakage
ignore_outcome = True
