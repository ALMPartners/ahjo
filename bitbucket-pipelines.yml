image: python:3.13

options:
  # Set maximum execution time for each step
  max-time: 5

pipelines:
  default:
    - parallel:
      - step:
          caches:
            - pip
          script:
            - apt-get update && apt-get -y install unixodbc-dev
            - pip install tox
            - tox -e py313 -- --pipeline
      - step:
          # Experimental: Python 3.14 relies on the SQLAlchemy 2.1 beta, so this job must not block the pipeline
          image: python:3.14
          caches:
            - pip
          script:
            - apt-get update && apt-get -y install unixodbc-dev
            - pip install tox
            - tox -e py314 -- --pipeline || true
      - step:
          caches:
            - pip
          script:
            - pip install safety
            - safety --stage cicd --key $PYUP_API_KEY scan
  custom:
    # Used to run scheduled checks
    safety:
      - step:
          caches:
            - pip
          script:
            - pip install safety
            - safety --stage cicd --key $PYUP_API_KEY scan
