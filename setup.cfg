[metadata]
name = ahjo
description = Database deployment framework
keywords = ahjo
long_description = file:README.md
long_description_content_type = text/markdown
url = https://github.com/ALMPartners/ahjo
author = ALM Partners Oy
author_email = servicedesk@almpartners.fi
license_file = LICENSE
classifiers =
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Topic :: Database
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14

[options]
include_package_data = True
python_requires = >=3.13
package_dir=
    =src
packages = find_namespace:
install_requires =
    alembic ~= 1.18.0
    pyparsing ~= 3.3.0
    # SQLAlchemy 2.0.x has no official Python 3.14 support; use the 2.1 beta there until 2.1 is GA
    sqlalchemy ~= 2.0.0; python_version < "3.14"
    sqlalchemy >= 2.1.0b1, < 2.2; python_version >= "3.14"
    PyYAML ~= 6.0.0
    lark ~= 1.3.0
    networkx ~= 3.6.0
    pydantic ~= 2.13.0

[options.extras_require]
mssql = pyodbc ~= 5.3.0
azure = azure-identity ~= 1.25.0
comparison = polars ~= 1.41.2
visualizations = plotly ~= 6.9.0
dev = black ~= 26.5.0
    pre-commit ~= 4.6.0
    pytest ~= 9.1.0
    tox ~= 4.58.0

[options.entry_points]
console_scripts =
    ahjo = ahjo.scripts.master:main
    ahjo-init-project = ahjo.scripts.init_project:main
    ahjo-multi-project-build = ahjo.scripts.multi_project_build:main
    ahjo-upgrade = ahjo.scripts.upgrade_project:main
    ahjo-scan = ahjo.scripts.scan_project:main
    ahjo-install-git-hook = ahjo.scripts.install_git_hook:main
    ahjo-config = ahjo.scripts.config:main
    alembic-api = ahjo.scripts.alembic_api:main

[options.packages.find]
where=src
